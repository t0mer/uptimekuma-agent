name: "JCR Docker Build"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get semantic version from file
        id: getSemver
        run: echo "semver=$(cat VERSION | tr -d ' \t\n\r')" >> "$GITHUB_OUTPUT"

      - name: Login to JFrog JCR
        env:
          JCR_URL: ${{ secrets.JCR_URL }}
          JCR_USERNAME: ${{ secrets.JCR_USERNAME }}
          JCR_TOKEN: ${{ secrets.JCR_TOKEN }}
        run: echo "$JCR_TOKEN" | docker login "$JCR_URL" --username "$JCR_USERNAME" --password-stdin

      - name: Build and push Docker image
        env:
          JCR_URL: ${{ secrets.JCR_URL }}
          SEMVER: ${{ steps.getSemver.outputs.semver }}
        run: |
          IMAGE_NAME="$JCR_URL/docker/uptimekuma-agent"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:$SEMVER" .
